{{- range $key,$val := .Values.applicationsets }}
{{- /*
in order to use tpl within a range, _and_ have the key/val available to sub-templates,
need to add some variables to the root context.
*/ -}}
{{- $_ := set $ "curAppName" (print $.Values.envName "-" $key) }}
{{- if $val.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ $key }}-{{ required "A valid envName is required" $.Values.envName }}
  namespace: {{$.Values.default.argocd.namespace | required (printf "argocd namespace name required")}}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  syncPolicy:
    preserveResourcesOnDeletion: {{ $val.preserveResourcesOnDeletion | default $.Values.default.applicationsets.preserveResourcesOnDeletion | default false }}
  generators:      
{{- if $val.generators }}
{{ tpl $val.generators $ | indent 2 }}
{{- else if $.Values.default.applicationsets.generators }}
{{ tpl $.Values.default.applicationsets.generators $ | indent 2 }}
{{- end }}

  template:
    metadata:
      name: {{ $key }}-{{ printf ("{{name}}") }}-{{ $.Values.envName }}
    spec:
      destination:
        namespace: {{ $val.destination.namespace | default $.Values.default.app.destination.namespace | required (printf "No destination.namespace specified for %s" $key ) }}
        server: {{ "{{server}}" | quote}}
      project: {{ $val.project | default $.Values.default.app.project | required (printf "No project specified for %s" $key ) }}
      syncPolicy:
{{- if $val.enableAutoSync | default $.Values.default.app.enableAutoSync }}
        automated:
          prune: {{ $val.autoSyncPrune | default $.Values.default.app.autoSyncPrune | default true }}
          selfHeal: true
{{- end }}
        syncOptions:
          - CreateNamespace=true
      source:
        path: {{ tpl $val.source.path $ }}
        repoURL: {{ $val.source.repoURL | default $.Values.default.app.source.repoURL | required (printf "No source.repoURL specified for %s" $key ) }}
        targetRevision: {{ $val.source.targetRevision | default $.Values.default.app.source.targetRevision | required (printf "No source.targetRevision specified for %s" $key ) }}

{{- if $val.source.extraSourceFields }}
{{ tpl $val.source.extraSourceFields $ | indent 8 }}
{{- else if $.Values.default.app.source.extraSourceFields }}
{{ tpl $.Values.default.app.source.extraSourceFields $ | indent 8 }}
{{- end }}
{{- if $val.extraFields }}
{{ tpl $val.extraFields $ | indent 4 }}
{{- else if $.Values.default.app.extraFields }}
{{ tpl $.Values.default.app.extraFields $ | indent 4 }}
{{- end }}
{{- end }}
{{- end }}
