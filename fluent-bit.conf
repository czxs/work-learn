    [SERVICE]
        Daemon Off
        Flush {{ .Values.flush }}
        Log_Level {{ .Values.logLevel }}
        Parsers_File customParsers
        Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port {{ .Values.metricsPort }}
        Health_Check On

   [INPUT]
        Name tail
        Path /var/log/containers/*.log
        multiline.parser  cri
        Tag aks_kube.*
        Mem_Buf_Limit 5MB
        Skip_Long_Lines On

   [FILTER]
        Name kubernetes
        Match aks_kube.*
        Kube_URL   https://kubernetes.default.svc
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Merge_Log On
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude On
        Kube_Tag_Prefix     aks_kube.var.log.containers.


    # 2. 关键新增：专门针对 Java 多行报错进行聚合的过滤器
    [FILTER]
        Name                  multiline
        Match                 aks_kube.*
        Multiline.key_content log
        # 使用我们在 parsers.conf 中定义的 java 报错规则
        Multiline.parser      multiline-regex-test
        
    [FILTER]
        Name            nest
        Match           aks_kube.*
        Operation       lift
        Nested_under    kubernetes
        Add_prefix      k8s_

    [OUTPUT]
        Name loki
        Match aks_kube.*
        Port 3100
        Host loki-ingester.monitoring.svc.cluster.local
        ## Logstash_Format On
        Retry_Limit False
        #Label_Keys  $log_fields['namespace'], $log_fields['pod_name']
        Labels cluster=aks-prod,namespace=$k8s_namespace_name,k8s_container_name=$k8s_container_name,k8s_pod_name=$k8s_pod_name
